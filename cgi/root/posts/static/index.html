<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>posts · hawk / portfolio</title>
<style>
  :root{
    --bg:#f4f1de;
    --bg-2:#ecead7;
    --ink:#0f0f12;
    --ink-2:#2a2a30;
    --muted:#5a5a64;
    --rule:#1a1a1f;
    --lime:#c4f542;
    --lime-ink:#0f0f12;
    --yellow:#ffd84a;
    --red:#ff4d4d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Inter","Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"JetBrains Mono","IBM Plex Mono","Menlo",ui-monospace,monospace}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;cursor:pointer}
  .wrap{max-width:920px;margin:0 auto;padding:32px 24px 80px}
  .head{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--rule);padding-bottom:14px;margin-bottom:28px}
  .head .dots{display:flex;gap:6px}
  .head .dots i{width:11px;height:11px;display:inline-block}
  .head .dots i:nth-child(1){background:var(--red)}
  .head .dots i:nth-child(2){background:var(--yellow)}
  .head .dots i:nth-child(3){background:var(--lime)}
  .head h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
  .head .crumbs{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
  .head .crumbs a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
  #app-root{min-height:60vh}
  .item-list{display:flex;flex-direction:column}
  .item{border:1px solid var(--ink);background:var(--bg);padding:18px 22px;margin-bottom:-1px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
  .item:first-child{border-radius:4px 4px 0 0}
  .item:last-child{border-radius:0 0 4px 4px}
  .item:hover{background:var(--bg-2)}
  .item.active{background:#fff;box-shadow:inset 4px 0 0 var(--lime), 4px 4px 0 var(--yellow)}
  .item .m{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .item .t{font-size:19px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
  .item .e{font-size:14px;color:var(--ink-2);line-height:1.5}
  .item .tg{display:flex;flex-wrap:wrap;gap:5px}
  .item .tg span{font-family:"JetBrains Mono",monospace;font-size:10.5px;padding:1px 6px;border:1px solid var(--ink);text-transform:lowercase}
  .state{padding:24px;text-align:center;font-family:"JetBrains Mono",monospace;font-size:13px;letter-spacing:.1em;color:var(--muted)}
  .state.err{color:var(--red)}

  /* ---------- drawer (right-side panel for article view) ---------- */
  .dr-mask{
    position:fixed;inset:0;background:rgba(15,15,18,.4);z-index:9000;
    opacity:0;pointer-events:none;transition:opacity .18s ease;
  }
  .dr-mask.open{opacity:1;pointer-events:auto}
  .dr{
    position:fixed;top:0;right:0;bottom:0;width:min(620px, 92vw);z-index:9100;
    background:var(--bg);border-left:1px solid var(--ink);
    box-shadow:-12px 0 0 var(--ink);
    transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.7,.2,1);
    display:flex;flex-direction:column;overflow-y:auto;
  }
  .dr[hidden]{display:none}     /* 覆盖 .dr{display:flex} 让 hidden=true 真正不渲染 */
  .dr-mask[hidden]{display:none}
  .dr.posts{width:min(720px, 92vw)}
  .dr.open{transform:translateX(0)}
  .dr.fullscreen{width:100vw;left:0;right:0;box-shadow:none;
    transition:width .22s cubic-bezier(.2,.7,.2,.2), left .22s cubic-bezier(.2,.7,.2,.2)}
  .dr.fullscreen:not(.open){transform:translateX(100%)}
  .dr-head{
    display:flex;align-items:center;gap:10px;
    padding:14px 18px;border-bottom:1px solid var(--ink);
    background:var(--bg-2);
  }
  .dr-head .dots{display:flex;gap:6px}
  .dr-head .dots i{width:11px;height:11px;display:inline-block}
  .dr-head .dots i:nth-child(1){background:var(--red)}
  .dr-head .dots i:nth-child(2){background:var(--yellow)}
  .dr-head .dots i:nth-child(3){background:var(--lime)}
  .dr-head .title{
    font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.18em;
    color:var(--ink);text-transform:uppercase;flex:1;text-align:center;
  }
  .dr-head button{
    background:transparent;border:1px solid var(--ink);font-family:"JetBrains Mono",monospace;
    font-weight:700;font-size:12px;padding:4px 10px;cursor:pointer;color:var(--ink);
  }
  .dr-head button:hover{background:var(--ink);color:var(--bg)}
  .dr-body{overflow-y:visible;flex:1;padding:24px 28px 36px}
  .dr-body .crumb{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
  .dr-body .crumb a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
  .dr-body .crumb{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .edit-btn{
    background:transparent;border:1px solid var(--ink);font-family:"JetBrains Mono",monospace;
    font-weight:700;font-size:11px;letter-spacing:.14em;padding:3px 10px;cursor:pointer;
    color:var(--ink);text-transform:uppercase;
  }
  .edit-btn:hover{background:var(--ink);color:var(--bg)}
  .dr-body h1{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:6px 0 12px}
  .dr-body .meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;padding-bottom:14px;border-bottom:1px solid var(--ink);margin-bottom:18px}
  .dr-body .meta .badge{background:var(--lime);color:var(--ink);padding:2px 7px;letter-spacing:.16em}
  .dr-body .body{font-size:16px;line-height:1.7;color:var(--ink-2)}
  .dr-body .body p{margin:0 0 14px}
  .dr-body .body h2{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:24px 0 10px;color:var(--ink)}
  .dr-body .body h3{font-size:18px;font-weight:700;margin:18px 0 8px;color:var(--ink)}
  .dr-body .body ul,.dr-body .body ol{margin:0 0 14px;padding-left:22px}
  .dr-body .body li{margin:4px 0}
  .dr-body .body code{font-family:"JetBrains Mono",monospace;font-size:13.5px;background:var(--bg-2);padding:1px 6px;border:1px solid var(--ink)}
  .dr-body .body pre{background:var(--ink);color:var(--bg);padding:14px 16px;font-family:"JetBrains Mono",monospace;font-size:13px;line-height:1.55;overflow-x:auto;margin:0 0 18px}
  .dr-body .body pre code{background:transparent;border:0;padding:0;color:var(--bg)}
  .dr-body .body blockquote{border-left:4px solid var(--lime);padding:4px 14px;margin:0 0 14px;background:var(--bg-2);color:var(--ink)}
  .dr-body .body table{border-collapse:collapse;margin:0 0 14px;width:100%;font-size:14px}
  .dr-body .body th,.dr-body .body td{border:1px solid var(--ink);padding:6px 10px;text-align:left}
  .dr-body .body th{background:var(--bg-2);font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.06em}
  .dr-body .body a{color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
  .dr-body .body strong{font-weight:700;color:var(--ink)}
  .dr-body .body em{font-style:italic}
  .dr-body .pnav{margin-top:24px;padding-top:16px;border-top:1px solid var(--ink);display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .dr-body .pnav .pn{border:1px solid var(--ink);padding:12px 14px;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);background:var(--bg)}
  .dr-body .pnav .pn:hover{background:var(--bg-2)}
  .dr-body .pnav .pn.next{text-align:right}
  .dr-body .pnav .pn .l{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
  .dr-body .pnav .pn .v{font-weight:600;font-size:14.5px;line-height:1.25}
  .dr-body .pnav .pn.disabled{opacity:.35;pointer-events:none}

  /* editor (新建 / 编辑) */
  .head-right{display:flex;align-items:center;gap:14px;margin-left:auto}
  .new-btn{
    background:var(--lime);color:var(--ink);border:1px solid var(--ink);
    font-family:"JetBrains Mono",monospace;font-weight:700;font-size:11px;
    letter-spacing:.14em;padding:4px 10px;cursor:pointer;text-transform:uppercase;
  }
  .new-btn:hover{background:var(--yellow)}
  .head .crumb{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
  .head .crumb a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}

  .editor{padding:18px 22px 22px;display:flex;flex-direction:column;gap:8px;flex:none;min-height:0}
  .editor label{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-bottom:2px}
  .editor input,.editor textarea{
    width:100%;box-sizing:border-box;
    font-family:"JetBrains Mono",monospace;font-size:14px;
    border:1px solid var(--ink);background:var(--bg);color:var(--ink);
    padding:8px 12px;outline:none;
  }
  .editor input:focus,.editor textarea:focus{background:#fff}
  .editor-toggle{
    display:inline-flex;gap:0;margin-left:8px;
    border:1px solid var(--ink);background:var(--bg);
  }
  .editor-toggle button{
    background:transparent;border:0;border-right:1px solid var(--ink);
    padding:2px 9px;font-family:"JetBrains Mono",monospace;font-size:10.5px;
    letter-spacing:.14em;color:var(--muted);cursor:pointer;text-transform:uppercase;
  }
  .editor-toggle button:last-child{border-right:0}
  .editor-toggle button.active{background:var(--ink);color:var(--bg)}
  .editor .half{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
  .editor .half > .preview,
  .editor .half > textarea,
  .editor .half > .editor-monaco{flex:1 1 auto;overflow:visible}
  .editor-monaco{
    flex:1 1 auto;border:1px solid var(--ink);background:#fdfdf7;
    min-height:0;overflow:visible;
  }
  .editor textarea{
    flex:1 1 auto;min-height:0;line-height:1.7;
    background:#fdfdf7;font-size:13.5px;
    tab-size:2;
    overflow:visible;resize:none;
  }
  .editor .row{display:flex;gap:10px;align-items:stretch;min-height:0}
  .editor .row.split{flex-direction:row;gap:14px;flex:none;min-height:0}
  .editor .half{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
  .editor .row.split > .half:first-child{flex:7 1 0;min-height:0;min-width:0}   /* 编辑区填满 7/8 */
  .editor .row.split > .half:last-child{flex:3 1 360px;min-height:0}    /* preview 占 3/8 */
  .editor .preview{
    flex:1;min-height:0;border:1px solid var(--ink);background:#fff;color:var(--ink);
    padding:8px 12px;overflow-y:visible;font-size:13.5px;line-height:1.55;
    font-family:Georgia,serif;white-space:normal;
  }
  .editor .preview h1,.editor .preview h2,.editor .preview h3{margin:14px 0 6px;font-weight:700;color:var(--ink)}
  .editor .preview h1{font-size:22px} .editor .preview h2{font-size:18px} .editor .preview h3{font-size:15px}
  .editor .preview p{margin:0 0 10px}
  .editor .preview pre{background:var(--ink);color:var(--bg);padding:10px 12px;overflow-x:auto;font-family:"JetBrains Mono",monospace;font-size:12.5px;line-height:1.5}
  .editor .preview code{font-family:"JetBrains Mono",monospace;background:var(--bg-2);padding:1px 5px;border:1px solid var(--ink);font-size:12.5px}
  .editor .preview pre code{background:transparent;border:0;padding:0;color:var(--bg)}
  /* per-language tint (no lexer, just visual hint) */
  .editor .preview pre code.language-rust,
  .editor .preview pre code.language-rs{box-shadow:inset 4px 0 0 #ffb86c}
  .editor .preview pre code.language-javascript,
  .editor .preview pre code.language-js,
  .editor .preview pre code.language-typescript,
  .editor .preview pre code.language-ts{box-shadow:inset 4px 0 0 #7dd3fc}
  .editor .preview pre code.language-ruby,
  .editor .preview pre code.language-rb{box-shadow:inset 4px 0 0 #ff79c6}
  .editor .preview pre code.language-shell,
  .editor .preview pre code.language-bash,
  .editor .preview pre code.language-sh{box-shadow:inset 4px 0 0 #a3e635}
  .editor .preview pre code.language-json,
  .editor .preview pre code.language-yaml,
  .editor .preview pre code.language-yml{box-shadow:inset 4px 0 0 #ffd866}
  .editor .preview pre code.language-html{box-shadow:inset 4px 0 0 #ff5555}
  .editor .preview pre code.language-css{box-shadow:inset 4px 0 0 #bd93f9}
  .editor .preview blockquote{border-left:4px solid var(--lime);padding:4px 12px;margin:0 0 10px;background:var(--bg-2);color:var(--ink)}
  .editor .preview ul,.editor .preview ol{margin:0 0 10px 22px}
  .editor .preview table{border-collapse:collapse;margin:0 0 10px;width:100%;font-size:13px}
  .editor .preview th,.editor .preview td{border:1px solid var(--ink);padding:6px 10px;text-align:left}
  .editor .preview th{background:var(--bg-2);font-family:"JetBrains Mono",monospace;font-size:12px}
  .editor .preview a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
  .editor .preview img{max-width:100%}
  .editor .actions{display:flex;gap:10px;justify-content:flex-end;padding-top:8px;border-top:1px solid var(--ink)}
  .editor .actions button{
    background:transparent;border:1px solid var(--ink);font-family:"JetBrains Mono",monospace;
    font-weight:700;font-size:12px;padding:6px 14px;cursor:pointer;color:var(--ink);
  }
  .editor .actions .save{background:var(--lime);color:var(--ink)}
  .editor .actions .save:hover{background:var(--yellow)}
  .editor .actions button:hover:not(.save){background:var(--ink);color:var(--bg)}
  .editor .err{color:var(--red);font-family:"JetBrains Mono",monospace;font-size:12px}
  @media (max-width:980px){
    .editor .row.split{flex-direction:column}
    .editor .row.split > .half:last-child{min-width:0}
  }
  /* 移动端 (<=640px): list 紧凑, drawer 全屏, header 紧凑 */
  @media (max-width: 640px){
    .wrap{padding:20px 14px 60px}
    .head{gap:10px;padding-bottom:10px;margin-bottom:20px}
    .head h1{font-size:15px}
    .head .head-right{gap:8px}
    .new-btn{font-size:10px;padding:3px 8px}
    .head .crumb{font-size:10px}
    .item{padding:14px 16px}
    .item .t{font-size:16px}
    .item .e{font-size:13px}
    .dr{width:100vw;left:0}
    .dr.posts{width:100vw}
    .dr-head{padding:10px 12px}
    .dr-body{padding:18px 16px 28px}
    .dr-body h1{font-size:26px;margin:4px 0 10px}
    .dr-body .meta{padding-bottom:10px;margin-bottom:14px;font-size:10.5px;gap:10px}
    .dr-body .pnav{grid-template-columns:1fr;gap:10px}
    .dr-body .pnav .pn.next{text-align:left}
    .editor{padding:14px 14px 18px}
    .editor .row.split{gap:10px}
    .editor input,.editor textarea{font-size:13px;padding:6px 10px}
    .editor-monaco{min-height:300px}
    .editor .editor-monaco{min-height:300px}
    /* 移动端隐藏 fullscreen toggle (drawer 已是 100vw 全屏) */
    #dr-fs,#posts-drawer-fs,#notes-drawer-fs{display:none}
    /* drawer 适配 iPhone 底部 home indicator 安全区 */
    .dr-body{padding-bottom:max(28px, env(safe-area-inset-bottom))}
  }
  /* 极窄屏 (<=480px): 进一步紧凑 */
  @media (max-width: 480px){
    .wrap{padding:16px 12px 48px}
    .head h1{font-size:14px}
    .head .head-right{gap:6px}
    .item{padding:12px 14px}
    .item .t{font-size:15px}
    .item .e{font-size:12.5px}
    .dr-head{padding:8px 10px;gap:8px}
    .dr-head .title{font-size:11px;letter-spacing:.14em}
    .dr-head button{padding:4px 8px;font-size:11px}
    .dr-body{padding:14px 12px 22px}
    .dr-body h1{font-size:22px}
    .dr-body .body{font-size:15px;line-height:1.65}
    .dr-body .body h2{font-size:18px;margin:18px 0 6px}
    .dr-body .body pre{font-size:12px;padding:10px 12px}
    .editor{padding:10px 10px 14px}
    .editor label{font-size:10px}
    .editor input,.editor textarea{font-size:13px}
    .editor-monaco{min-height:240px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <span class="dots"><i></i><i></i><i></i></span>
    <h1>posts · hawk</h1>
    <div class="head-right">
      <button id="new-post-btn" type="button" class="new-btn">+ new</button>
      <a href="/root" class="crumb">← /root</a>
    </div>
  </header>
  <main id="app-root">
    <div class="state">loading…</div>
  </main>
</div>

<!-- right-side drawer (lazy-injected) -->
<div id="dr-mask" class="dr-mask" hidden></div>
<aside id="dr" class="dr" hidden aria-label="article reader" role="dialog">
  <div class="dr-head">
    <span class="dots"><i></i><i></i><i></i></span>
    <span class="title" id="dr-title">Posts</span>
    <button id="dr-fs" type="button" aria-label="toggle fullscreen" title="全屏 / 恢复 (F)">⛶</button>
    <button id="dr-close" type="button" aria-label="close">ESC ✕</button>
  </div>
  <div id="dr-body" class="dr-body"></div>
</aside>

<script src="/root/assets/markdown-it-14.1.0.min.js"></script>
<script src="/root/assets/vs/loader.js"></script>
<script src="/root/posts/assets/posts.js"></script>
</body>
</html>
