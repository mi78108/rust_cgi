<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gentoo Cat</title>
    <link rel="stylesheet" href="/static/path/css/uikit.min.css">
    <script src="/static/path/js/uikit.min.js"></script>
    <script src="/static/path/js/uikit-icons.min.js"></script>

    <!-- Vditor -->
    <link rel="stylesheet" href="/website/static/css/dist/index.css" />
    <script src="/website/static/js/dist/index.min.js"></script>

    <style>
    .vditor {
    border-radius: 8px !important;
    overflow: hidden;
    border: 1px solid #e5e7eb !important;
    }
    .uk-card {
    border-radius: 12px;
    }
    </style>
  </head>
  <body id="body" class="uk-background-muted">
    <!-- 导航栏 -->
    <nav class="uk-navbar-container uk-navbar-transparent uk-light uk-background-primary" uk-navbar>
      <div class="uk-navbar-left">
        <a class="uk-navbar-item uk-logo" href="#">
          <span uk-icon="icon: pencil; ratio: 1.2"></span> &nbsp;个人博客
        </a>
      </div>
      <div class="uk-navbar-right">
        <ul class="uk-navbar-nav">
          <li><a href="/website"><span uk-icon="home"></span> 首页</a></li>
          <li class="uk-active"><a href="#"><span uk-icon="file-edit"></span> 写文章</a></li>
          <li><a href="#"><span uk-icon="album"></span> 文章管理</a></li>
        </ul>
      </div>
    </nav>

    <!-- 内容区域 -->
    <div class="uk-container uk-margin-large-top uk-margin-large-bottom">
      <div class="uk-card uk-card-default uk-card-large uk-card-body">
        <h3 class="uk-card-title uk-margin-medium-bottom">
          <span uk-icon="icon: file-text; ratio: 1.1"></span> @{ art['title'].nil? ? "撰写新文章" : "变更 #{art['title']}"}
        </h3>

        <!-- 文章标题 -->
        <div class="uk-margin-medium">
          <input class="uk-input uk-form-large" type="text" placeholder="请输入文章标题" id="article-title">
        </div>

        <!-- 编辑器 -->
        <div class="uk-margin-medium">
          <div id="editor"></div>
        </div>

        <!-- 按钮组 -->
        <div class="uk-flex uk-flex-right uk-margin-large-top">
          <button class="uk-button uk-button-default uk-margin-right" id="btn-clear">
            <span uk-icon="trash"></span> 清空内容
          </button>
          <button class="uk-button uk-button-primary" id="btn-save">
            <span uk-icon="save"></span> 保存文章
          </button>
        </div>
      </div>
    </div>

    <script>
    //document.rid = (new Date()).getTime();
    document.rid = "@{rid}";
    document.art = @{art.to_json};
    // 初始化 Vditor
    const vditor = new Vditor('editor', {
      //mode: 'wysiwyg', // IR 即时 wysiwyg 所见即所得 sv分屏
      mode: 'ir',
      height: "auto",
      width: "auto",
      placeholder: '开始写你的文章，支持粘贴/拖拽上传图片...',
      outline: true,
      cdn : "/website/static/path",
      preview: {
        actions: ["desktop", "tablet", "mobile"],
        hljs: {
          lineNumber: true
        }
      },
      comment: {
        enable: true
      },
      upload: {
        url: `/website/sys/upload?rid=${document.rid}`,
        accept: 'image/*',
        paste: true,
        drag: true,
        multiple: true,
        withCredentials: false,
        success: (element, resp) => {
          if(resp){
            console.log(resp)
            JSON.parse(resp).forEach(v=>{
              vditor.insertValue(`![](/website/sys/static/${v})`)
            })
          }
        }
      }
    });

    // 保存文章
    document.getElementById('btn-save').addEventListener('click', () => {
      const title = document.getElementById('article-title').value.trim();
      const content = vditor.getValue();
      if (!title) {
        UIkit.notification({ message: '请输入文章标题', status: 'warning', pos: 'top-center' });
        return;
      }
      if (!content) {
        UIkit.notification({ message: '文章内容不能为空', status: 'warning', pos: 'top-center' });
        return;
      }

      fetch(`/website/sys/post?rid=${document.rid}`,{
        method: `@{art.empty? ? 'POST' : 'PUT'}`,
        body: JSON.stringify({
          title: title,
          content: content,
          created_at: document.art['created_at'],
          content_html: vditor.getHTML()
        })
      }).then(resp=>resp.json()).then(resp=>{
          if (resp && resp['opt'] == 'ok'){
            document.rid = resp['val'];
            UIkit.notification({
              message: '✅ 文章保存成功！',
              status: 'success',
              pos: 'top-center',
              timeout: 2000
            });
            if(document.art['title']){
              setTimeout(()=>{
                window.location.href = `/website/sys/${document.rid}`
              },2000)
            }
          }
        }).catch(e=>{
          UIkit.notification({
            message: '保存失败 ' + e,
            status: 'error',
            pos: 'top-center',
            timeout: 2000
          });
        })
    });

    // 清空编辑器
    document.getElementById('btn-clear').addEventListener('click', () => {
      document.getElementById('article-title').value = '';
      vditor.setValue('');
      UIkit.notification({ message: '已清空', status: 'primary', pos: 'top-center' });
    });

    window.onload = (ev)=>{
      vditor.setValue(document.art['content'] || "")
      document.getElementById('article-title').value = document.art['title'] || "";
    }
    </script>
  </body>
</html>
