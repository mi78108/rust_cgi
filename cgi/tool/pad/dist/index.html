<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pad · 协作编辑器</title>
<link rel="stylesheet" href="/tool/pad/style.css">
</head>
<body>

<div class="wrap">
  <header>
    <h1>pad</h1>
    <span class="meta">collaborative text editor · CRDT over WebSocket</span>
    <span class="spacer"></span>
    <div class="room-bar">
      <span class="meta">ws</span>
      <span class="meta mono">/tool/pad/ws</span>
    </div>
    <button id="btn-clear" title="清空文档（所有客户端都会清空）">clear</button>
    <button id="btn-reconnect">reconnect</button>
    <span id="status" class="pill pending">disconnected</span>
  </header>

  <div class="editor-box">
    <div class="editor-bar">
      <span>textarea</span>
      <span class="meta">·</span>
      <span class="meta">peers online: <span id="peers" class="who">0</span></span>
      <span class="meta">·</span>
      <span class="meta">ops: <span id="ops-local" class="who">0</span> local / <span id="ops-global" class="who">0</span> global</span>
      <span class="spacer"></span>
      <span class="meta">doc: <span id="doc" class="who">default</span></span>
      <span class="meta">·</span>
      <span class="meta">you: <button id="me" class="who who-btn" title="点击修改名称和颜色">—</button></span>
    </div>

    <div class="editor-frame">
      <textarea id="ta" spellcheck="false" placeholder="开始写…"></textarea>
      <!-- 远端光标层: 用 mirror 文本量出对方光标的像素位置 -->
      <div class="cursor-layer">
        <div class="cursor-mirror" id="mirror"></div>
        <span class="cursor-anchor" id="anchor"></span>
      </div>
    </div>
  </div>

  <footer>
    <span>CRDT: <code>self-implemented RGA</code></span>
    <span>·</span>
    <span>backend: <code>/tool/pad/ws</code> (authoritative op log)</span>
    <span>·</span>
    <span class="meta">open 2+ tabs on this page to test sync</span>
  </footer>
</div>

<div id="toast" class="toast"></div>

<!-- 个人资料弹窗 —— 点状态栏的 "you" 打开 -->
<div id="profile-pop" class="pop" hidden>
  <div class="pop-card" role="dialog" aria-label="个人资料">
    <div class="pop-head">
      <span class="pop-title">个人资料</span>
      <button id="profile-close" class="pop-x" title="关闭">×</button>
    </div>

    <label class="pop-row">
      <span class="pop-label">名称</span>
      <input id="profile-name" type="text" maxlength="32" spellcheck="false"
             placeholder="user-xxxx" autocomplete="off">
    </label>

    <div class="pop-row">
      <span class="pop-label">颜色</span>
      <div id="profile-swatches" class="swatches"></div>
    </div>

    <div class="pop-row">
      <span class="pop-label">自定义</span>
      <input id="profile-color" type="color" title="自定义颜色">
    </div>

    <div class="pop-foot">
      <span class="pop-hint">改动会同步给其他客户端</span>
      <button id="profile-save" class="pop-save">保存</button>
    </div>
  </div>
</div>

<!-- 普通 js/html, 无构建步骤 -->
<script type="module" src="/tool/pad/app.js"></script>

</body>
</html>
