<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>环境变化曲线</title>
    <!-- 引入 ECharts -->
    <script src="/static/path/js/echarts.min.js"></script>
  </head>
  <body>
    <!-- 图表容器 -->
    <div id="tempChart" style="width: 100%;height:500px;"></div>

    <script>
    let refresh = new URLSearchParams(window.location.search).get("refresh");
    if(refresh && refresh > 3){
      setTimeout(()=>{
        location.reload()
      }, refresh * 1000)
    }
    // 1. 初始化图表
    var chartDom = document.getElementById('tempChart');
    var myChart = echarts.init(chartDom);

    // 2. 图表配置
    var option = {
      title: { text: ` 环境变化趋势图 @{%x(sqlite3 #{$db} "select max(create_time) as last, creator from report;")}` },
      tooltip: { trigger: 'axis' }, // 鼠标悬浮提示
      xAxis: {
        type: 'category',
        data: @{%x(sqlite3 --json #{$db} "select create_time as t from report where name='light' and create_time > DATETIME('now', '-24 hours');").rstrip}.map(v=>v['t'])
    },
    legend: { data: ['温度', '湿度', '亮度'] },
      yAxis: {
        type: 'value',
      },
      series: [
      {
          name: "温度",
          type: 'line',      // 折线图
          smooth: true,      // 平滑曲线
          data: @{%x(sqlite3 --json #{$db} "select value as v from report where name='temp' and create_time > DATETIME('now', '-24 hours');").rstrip}.map(v=>v['v']),
        itemStyle: { color: '#F56C6C' },
        markPoint: { data: [{ type: 'max', name: '最大值' }, { type: 'min', name: '最小值' }] },
        markLine: { data: [{ type: 'average', name: '平均值' }] }

      },
        {
          name: "湿度",
          type: 'line',      // 折线图
          smooth: true,      // 平滑曲线
          data: @{%x(sqlite3 --json #{$db} "select value as v from report where name='humi' and create_time > DATETIME('now', '-24 hours');").rstrip}.map(v=>v['v']),
        itemStyle: { color: '#409EFF' },
        markPoint: { data: [{ type: 'max', name: '最大值' }, { type: 'min', name: '最小值' }] },
        markLine: { data: [{ type: 'average', name: '平均值' }] }
      },
        {
          name: "亮度",
          type: 'line',      // 折线图
          smooth: true,      // 平滑曲线
          data: @{%x(sqlite3 --json #{$db} "select value as v from report where name='light' and create_time > DATETIME('now', '-24 hours');").rstrip}.map(v=>v['v']),
        itemStyle: { color: '#E6A23C' },
        markPoint: { data: [{ type: 'max', name: '最大值' }, { type: 'min', name: '最小值' }] },
        markLine: { data: [{ type: 'average', name: '平均值' }] }
    }
    ]
    };

    // 3. 渲染
    myChart.setOption(option);
    </script>
  </body>
