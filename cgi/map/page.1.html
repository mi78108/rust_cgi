<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title id="tn">离线地图</title>
    <!-- 引入 Leaflet -->
    <link rel="stylesheet" href="/map/static/path/leaflet.css">
    <script src="/map/static/path/leaflet.js"></script>
    <style>
    #map { width: 100%; height: 800px; }
    .info-box {
    position: fixed;
    z-index: 9999;
    background: rgba(0,0,0,0.7);
    color: #fff;
    padding: 6px 12px;
    border-radius: 5px;
    font-size: 14px;
    }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div class="info-box" style="top: 15px; right: 15px" id="zoomText">缩放级别：10</div>
    <div class="info-box" style="bottom: 15px; left: 15px" id="positionText"></div>

    <script>
    // 初始化地图
    const map = L.map('map').setView([30.5699, 104.0408], 10);
    map.on('zoomend', (ev)=>{
      document.getElementById("zoomText").innerText  = `缩放 ${map.getZoom()}`
    });
    map.on('mousemove', function(e) {
      document.getElementById('positionText').innerText =
        `经度：${e.latlng.lng.toFixed(6)}  纬度：${e.latlng.lat.toFixed(6)}`;
    });

    // 加载本地离线瓦片
    L.tileLayer('/map/tiles/{z}/{x}/{y}.png', {
      minZoom: 5,
      maxZoom: 18,
      attribution: 'MBTiles 离线地图'
    }).addTo(map);
    </script>
  </body>
</html>
